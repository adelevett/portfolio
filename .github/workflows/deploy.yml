name: Build and Deploy Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # For every slides.typ found, run typst query + compile
      - name: Process engagements
        run: |
          find . -name "slides.typ" \
            -not -path "./node_modules/*" \
            -not -path "./_site/*" | while read typfile; do
              dir=$(dirname "$typfile")
              echo "Processing $typfile"

              # Extract metadata to engagement.json
              typst query "$typfile" "<engagement>" --field value \
                | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps(d[0], indent=2))" \
                > "$dir/engagement.json" \
                && echo "  ✓ engagement.json written" \
                || echo "  ✗ query failed for $typfile"

              # Compile PDF (continue on failure — fonts may be missing in CI)
              typst compile "$typfile" "$dir/slides.pdf" \
                && echo "  ✓ slides.pdf compiled" \
                || echo "  ✗ compile failed (assets/fonts may be missing in CI)"
          done

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
